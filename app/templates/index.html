<!DOCTYPE html>
<html>
  <head>
    <title>Meme Viewer</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
  </head>
  <body>
    <canvas id="matrix-rain"></canvas>

    <div id="page">
      <div>
        <img src="{{ url_for('static', filename='logo.png') }}" alt="Memes R Us logo" id="logo" />
      </div>

      <div id="content">
        <h1>{{ message }}</h1>
        <img src="{{ meme_url }}" alt="Our random gif" />
      </div>
    </div>

    <script>
      const canvas = document.getElementById('matrix-rain');
      const ctx = canvas.getContext('2d');

      // Mix of katakana + Latin + digits — the authentic Matrix look
      const CHARS = 'ｦｧｨｩｪｫｬｭｮｯｰｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎﾏﾐﾑﾒﾓﾔﾕﾖﾗﾘﾙﾚﾛﾜﾝ0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ';
      const FONT_SIZE = 16;
      let columns, drops;

      function resize() {
        canvas.width  = window.innerWidth;
        canvas.height = window.innerHeight;
        columns = Math.floor(canvas.width / FONT_SIZE);
        // Keep existing drop positions where possible, add new ones
        drops = Array.from({ length: columns }, (_, i) => (drops && drops[i]) || Math.random() * -100);
      }

      function draw() {
        // Semi-transparent black fade — creates the trailing tail effect
        ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.font = `${FONT_SIZE}px monospace`;

        for (let i = 0; i < drops.length; i++) {
          const char = CHARS[Math.floor(Math.random() * CHARS.length)];
          const y = drops[i] * FONT_SIZE;

          // Bright white-green for the leading character, normal green for the rest
          ctx.fillStyle = drops[i] > 1 && Math.random() > 0.95 ? '#ffffff' : '#00ff41';
          ctx.fillText(char, i * FONT_SIZE, y);

          // Reset drop randomly after it passes the bottom
          if (y > canvas.height && Math.random() > 0.975) {
            drops[i] = 0;
          }
          drops[i]++;
        }
      }

      resize();
      window.addEventListener('resize', resize);
      setInterval(draw, 50);
    </script>
  </body>
</html>
